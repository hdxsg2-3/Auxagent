name: Deploy

# 只允许手动触发：仓库页面 Actions -> Deploy -> Run workflow
on:
  workflow_dispatch:

# 同一时间只允许一个部署任务，避免两次部署互相覆盖
concurrency:
  group: auxagent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署到 aux.sziit.top
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ---- 缓存策略（全部使用 Actions 原生机制，无自定义跳过逻辑）----
      # 1) 构建产物缓存：前端源码未变化时直接复用上次的 dist，跳过安装与构建
      # 2) node_modules 缓存：源码变了但依赖未变时，省掉 npm ci
      # 3) setup-node 的 npm 缓存：真正需要安装时复用下载缓存
      - name: 缓存前端构建产物
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: Computer/doncx/frontend/dist
          key: vite-dist-v1-${{ hashFiles('Computer/doncx/frontend/src/**', 'Computer/doncx/frontend/index.html', 'Computer/doncx/frontend/*.js', 'Computer/doncx/frontend/package-lock.json') }}

      - name: 准备 Node 20
        if: steps.dist-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Computer/doncx/frontend/package-lock.json

      - name: 缓存 node_modules
        id: modules-cache
        if: steps.dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: Computer/doncx/frontend/node_modules
          key: node-modules-v1-${{ hashFiles('Computer/doncx/frontend/package-lock.json') }}

      - name: 安装前端依赖
        if: steps.dist-cache.outputs.cache-hit != 'true' && steps.modules-cache.outputs.cache-hit != 'true'
        working-directory: Computer/doncx/frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 构建前端
        if: steps.dist-cache.outputs.cache-hit != 'true'
        working-directory: Computer/doncx/frontend
        run: npm run build

      - name: 确认前端产物
        run: |
          if [ ! -f Computer/doncx/frontend/dist/index.html ]; then
            echo "前端产物缺失（缓存可能已损坏），请删除缓存后重跑" >&2
            exit 1
          fi
          echo "前端入口：$(grep -o 'assets/[^"]*\.js' Computer/doncx/frontend/dist/index.html)"
          if [ "${{ steps.dist-cache.outputs.cache-hit }}" = "true" ]; then
            echo "前端源码未变化 -> 复用缓存，已跳过 npm ci 与构建"
          elif [ "${{ steps.modules-cache.outputs.cache-hit }}" = "true" ]; then
            echo "依赖未变化 -> 复用 node_modules 缓存，仅重新构建"
          else
            echo "依赖有变化 -> 本次重新安装依赖并构建"
          fi

      - name: 打包后端与前端产物
        run: |
          tar -czf /tmp/auxagent-deploy.tar.gz \
            --exclude='*__pycache__*' \
            --exclude='*.pyc' \
            --exclude='*.db' \
            --exclude='*/logs/*' \
            -C Computer/doncx backend frontend/dist
          ls -lh /tmp/auxagent-deploy.tar.gz
          echo "包含文件数：$(tar -tzf /tmp/auxagent-deploy.tar.gz | wc -l)"

      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: 上传发布包与部署脚本
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/auxagent-deploy.tar.gz \
            Computer/doncx/deploy/deploy.sh \
            "$SSH_USER@$SSH_HOST:/tmp/"

      - name: 在服务器执行部署
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "bash /tmp/deploy.sh /tmp/auxagent-deploy.tar.gz"

      - name: 从公网验证
        run: |
          echo "健康检查："
          curl -fsS --max-time 20 https://aux.sziit.top/api/health
          echo
          echo "首页："
          curl -fsS --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" https://aux.sziit.top/
